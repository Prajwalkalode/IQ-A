name: Preserve data

on:
  workflow_dispatch:
    inputs:
      confirm_writes_paused:
        description: Confirm that application writes are paused before scanning the tables.
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

permissions:
  contents: read

concurrency:
  group: project-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preserve-data:
    name: Back up DynamoDB data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-south-1
      DYNAMODB_BACKUP_BUCKET: ${{ vars.DYNAMODB_BACKUP_BUCKET }}
    steps:
      - name: Require writes-paused confirmation
        env:
          CONFIRM_WRITES_PAUSED: ${{ inputs.confirm_writes_paused }}
        run: |
          if [ "$CONFIRM_WRITES_PAUSED" != "yes" ]; then
            echo "::error::Pause application writes and select yes before creating a snapshot."
            exit 1
          fi

      - name: Require backup bucket configuration
        run: |
          if [ -z "$DYNAMODB_BACKUP_BUCKET" ]; then
            echo "::error::Set the DYNAMODB_BACKUP_BUCKET repository variable to an external S3 bucket."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements-data-pipelines.txt

      - name: Install data-pipeline dependencies
        run: python -m pip install -r .github/scripts/requirements-data-pipelines.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Initialize Terraform state
        working-directory: terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Read DynamoDB table names from Terraform state
        run: |
          set -euo pipefail

          while IFS='=' read -r env_name output_name; do
            table_name="$(terraform -chdir=terraform output -raw "$output_name")"
            if [[ ! "$table_name" =~ ^[A-Za-z0-9_.-]{3,255}$ ]]; then
              echo "::error::Terraform returned an invalid table name for $output_name."
              exit 1
            fi
            echo "$env_name=$table_name" >> "$GITHUB_ENV"
          done <<'EOF'
          USERS_TABLE=identity_users_table_name
          QUESTIONS_TABLE=question_questions_table_name
          QUIZ_SESSIONS_TABLE=quiz_sessions_table_name
          QUIZ_ASSIGNMENTS_TABLE=quiz_assignments_table_name
          SUBMISSIONS_TABLE=submission_table_name
          EOF

      - name: Create snapshot ID
        id: snapshot
        run: echo "snapshot_id=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Scan, upload, and verify snapshot
        env:
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
        run: python .github/scripts/dynamodb_data.py preserve --snapshot-id "$SNAPSHOT_ID" --writes-paused
