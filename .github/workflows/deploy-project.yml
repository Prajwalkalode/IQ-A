name: Deploy project

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Apply infrastructure and deploy services
    needs: validate
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify application secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          test -n "$JWT_SECRET" || { echo "::error::Add the JWT_SECRET Actions secret."; exit 1; }
          test -n "$INTERNAL_API_KEY" || { echo "::error::Add the INTERNAL_API_KEY Actions secret."; exit 1; }

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Plan infrastructure
        working-directory: terraform
        run: terraform plan -input=false -out="$RUNNER_TEMP/terraform.tfplan"

      - name: Apply infrastructure
        working-directory: terraform
        run: terraform apply -input=false "$RUNNER_TEMP/terraform.tfplan"

      - name: Package, configure, and deploy services
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          set -euo pipefail

          deployment_dir="$(mktemp -d)"
          trap 'rm -rf "$deployment_dir"' EXIT

          for service in identity question quiz submission; do
            service_dir="services/${service}-service"
            function_name="$(terraform -chdir=terraform output -raw "${service}_lambda_function_name")"
            current_env="$deployment_dir/${service}-current.json"
            merged_env="$deployment_dir/${service}-merged.json"
            lambda_env="$deployment_dir/${service}-environment.json"

            aws lambda get-function-configuration \
              --function-name "$function_name" \
              --query 'Environment.Variables' \
              --output json > "$current_env"

            jq --arg jwt "$JWT_SECRET" --arg internal "$INTERNAL_API_KEY" \
              '(. // {}) + {JWT_SECRET: $jwt, INTERNAL_API_KEY: $internal}' \
              "$current_env" > "$merged_env"
            jq -n --slurpfile variables "$merged_env" \
              '{Variables: $variables[0]}' > "$lambda_env"

            aws lambda update-function-configuration \
              --function-name "$function_name" \
              --environment "file://$lambda_env" > /dev/null
            aws lambda wait function-updated --function-name "$function_name"

            npm ci --omit=dev --prefix "$service_dir"
            (
              cd "$service_dir"
              zip -qr "$deployment_dir/${service}.zip" src node_modules package.json
            )

            aws lambda update-function-code \
              --function-name "$function_name" \
              --zip-file "fileb://$deployment_dir/${service}.zip" > /dev/null
            aws lambda wait function-updated --function-name "$function_name"
          done

      - name: Smoke test service APIs
        run: |
          set -euo pipefail

          for service in identity question quiz submission; do
            endpoint="$(terraform -chdir=terraform output -raw "${service}_api_endpoint")"
            expected="${service}-service ok"
            response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$endpoint/health")"
            printf '%s' "$response" | jq --exit-status --arg expected "$expected" '.status == $expected' > /dev/null
            echo "$service API health check passed"
          done
