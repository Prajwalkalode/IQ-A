name: Deploy project

on:
  workflow_dispatch:
    inputs:
      reseed_data:
        description: Restore data from an S3 snapshot after deployment.
        required: true
        type: boolean
        default: false
      snapshot_id:
        description: Snapshot ID to restore, or "latest" to use the newest completed snapshot.
        required: false
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: project-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Apply infrastructure and deploy services
    needs: validate
    runs-on: ubuntu-latest
    environment: deploy
    env:
      AWS_REGION: ap-south-1
      DYNAMODB_BACKUP_BUCKET: ${{ vars.DYNAMODB_BACKUP_BUCKET || secrets.DYNAMODB_BACKUP_BUCKET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify application secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          test -n "$JWT_SECRET" || { echo "::error::Add the JWT_SECRET Actions secret."; exit 1; }
          test -n "$INTERNAL_API_KEY" || { echo "::error::Add the INTERNAL_API_KEY Actions secret."; exit 1; }

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Plan infrastructure
        working-directory: terraform
        run: terraform plan -input=false -out="$RUNNER_TEMP/terraform.tfplan"

      - name: Apply infrastructure
        working-directory: terraform
        run: terraform apply -input=false "$RUNNER_TEMP/terraform.tfplan"

      - name: Package service artifacts
        run: |
          set -euo pipefail

          deployment_dir="$RUNNER_TEMP/iq-a-lambda-packages"
          mkdir -p "$deployment_dir"

          for service in identity question quiz submission; do
            service_dir="services/${service}-service"
            npm ci --omit=dev --prefix "$service_dir"
            (
              cd "$service_dir"
              zip -qr "$deployment_dir/${service}.zip" src node_modules package.json
            )
          done

      - name: Configure Lambda application secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          set -euo pipefail

          deployment_dir="$RUNNER_TEMP/iq-a-lambda-packages"
          for service in identity question quiz submission; do
            function_name="$(terraform -chdir=terraform output -raw "${service}_lambda_function_name")"
            current_env="$deployment_dir/${service}-current.json"
            merged_env="$deployment_dir/${service}-merged.json"
            lambda_env="$deployment_dir/${service}-environment.json"

            aws lambda get-function-configuration \
              --function-name "$function_name" \
              --query 'Environment.Variables' \
              --output json > "$current_env"
            jq --arg jwt "$JWT_SECRET" --arg internal "$INTERNAL_API_KEY" \
              '(. // {}) + {JWT_SECRET: $jwt, INTERNAL_API_KEY: $internal}' \
              "$current_env" > "$merged_env"
            jq -n --slurpfile variables "$merged_env" \
              '{Variables: $variables[0]}' > "$lambda_env"

            aws lambda update-function-configuration \
              --function-name "$function_name" \
              --environment "file://$lambda_env" > /dev/null
            aws lambda wait function-updated --function-name "$function_name"
          done

      - name: Deploy service packages
        run: |
          set -euo pipefail

          deployment_dir="$RUNNER_TEMP/iq-a-lambda-packages"
          for service in identity question quiz submission; do
            function_name="$(terraform -chdir=terraform output -raw "${service}_lambda_function_name")"
            aws lambda update-function-code \
              --function-name "$function_name" \
              --zip-file "fileb://$deployment_dir/${service}.zip" > /dev/null
            aws lambda wait function-updated --function-name "$function_name"
          done

      - name: Smoke test service APIs
        run: |
          set -euo pipefail

          for service in identity question quiz submission; do
            endpoint="$(terraform -chdir=terraform output -raw "${service}_api_endpoint")"
            expected="${service}-service ok"
            response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$endpoint/health")"
            printf '%s' "$response" | jq --exit-status --arg expected "$expected" '.status == $expected' > /dev/null
            echo "$service API health check passed"
          done

      - name: Require backup bucket configuration
        if: ${{ inputs.reseed_data }}
        run: |
          if [ -z "$DYNAMODB_BACKUP_BUCKET" ]; then
            echo "::error::Set the DYNAMODB_BACKUP_BUCKET repository variable or secret."
            exit 1
          fi

      - name: Set up Python for data restore
        if: ${{ inputs.reseed_data }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-pipeline dependencies
        if: ${{ inputs.reseed_data }}
        run: python -m pip install -r .github/scripts/requirements-data-pipelines.txt

      - name: Read DynamoDB table names for restore
        if: ${{ inputs.reseed_data }}
        run: |
          set -euo pipefail

          while IFS='=' read -r env_name output_name; do
            table_name="$(terraform -chdir=terraform output -raw "$output_name")"
            if [[ ! "$table_name" =~ ^[A-Za-z0-9_.-]{3,255}$ ]]; then
              echo "::error::Terraform returned an invalid table name for $output_name."
              exit 1
            fi
            echo "$env_name=$table_name" >> "$GITHUB_ENV"
          done <<'EOF'
          USERS_TABLE=identity_users_table_name
          QUESTIONS_TABLE=question_questions_table_name
          QUIZ_SESSIONS_TABLE=quiz_sessions_table_name
          QUIZ_ASSIGNMENTS_TABLE=quiz_assignments_table_name
          SUBMISSIONS_TABLE=submission_table_name
          EOF

      - name: Restore selected snapshot
        if: ${{ inputs.reseed_data }}
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id || 'latest' }}
        run: python .github/scripts/dynamodb_data.py reseed --snapshot-id "$SNAPSHOT_ID"

      - name: Clean up deployment packages
        if: always()
        run: rm -rf "$RUNNER_TEMP/iq-a-lambda-packages"
